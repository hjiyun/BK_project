# 지칭어 통제어휘집 — 남측(South Korea) 개체 (v1 초안, KWIC 검수 전)
# 논문 부록용. 점유율 = 변이형 빈도 / 개체 총 언급.
# 매칭은 Kiwi 토큰(사용자 사전 적용) 기준. 불용은 명시적 목록으로 보강.
entity: 남측
unit: 기사(ncd)
layer: [1]            # 앵커·리포트·취재진
quote_versions: [포함, 제외]   # quote_spans 내외 두 버전

# 폐쇄 개체군 (점유율 분모) — KWIC 검수 후 확정
types:
  관계어:   [남측, 남녘, 남녘땅, 남조선]     # 남조선=북한 이념호칭(주로 인용). 관계·비국가 틀
  국가명:   [한국, 대한민국]
  지역명:   [남한]
  환유:     [청와대, 용산]                 # 서울 제외(환유 판정 애매·저빈도)

# 보조지표(폐쇄 개체군 밖) — 화자 위치 노출. 인용제외 + 화자명시형만
화자포함_보조: ["우리 정부", "우리 군", 우리나라]

# KWIC 검수 결과 (2026-08-13, 각 30건)
kwic_review:
  한국:  오탐 ~13% (한국전쟁·한국형·기관명 한국국가안보전략연구원 등) → 인접명사 배제로 해소. 유지
  우리:  북한지시 27%·비남측 43% → 폐쇄 개체군 제외. bare 우리 미사용

# 매칭 규칙
rules:
  - "Kiwi 토큰(사용자 사전 적용). 변이형 form 일치 + 명사태그"
  - "인접명사 배제: 변이형 바로 뒤 토큰이 공백 없이 붙은 명사/접미(NNG·NNP·XSN)면 복합어로 보고 제외 (한국전쟁·한국형·한국은행). 조사(J*)·공백분리 어절은 유지(한국은·한국 정부)"

# 불용(오탐 제거) — Kiwi 토큰이 아래 복합어의 일부이면 개체 지시 아님
stoplist:
  한국:  [한국전쟁, 한국은행, 한국일보, 한국계, 한국어, 한국사, 한국형, 한국산, 대한국민, 북한국]
  한국인: 미정   # 국민 지시 — KWIC 검수 후 포함/제외 결정, 문서화
  우리:  [우리민족끼리, "우리 사회", "우리 국민", "우리 민족"]  # 일반/북한 지시 용법
  서울:  [서울역, 서울시, 서울대, 서울지방, 서울중앙]           # 단순 지명. 정부 환유만 포함
  용산:  [용산역, 용산구]                                    # 대통령실 환유만
  청와대: []

# 특기사항
notes:
  - "우리: 북한 인용문 안의 '우리'는 북한 지시 → 인용 제외 버전에서 자동 해소"
  - "서울/용산/청와대: 환유 판정 애매하면 제외(빈도 낮아 영향 작음)"
  - "한국인: 개체(국가) vs 국민 지시 구분 대상"
