# 지칭어 통제어휘집 — 유튜브 적용분 (KBS referent_lexicon.yaml 보완)
# 폐쇄 개체군·인접명사 배제 규칙은 KBS와 동일. 아래는 유튜브 고유 판정만 기록.
entity: 남측
unit: 영상(video_id)
corpus: master/videos.parquet text_clean, 2024 (6개 채널 592편)

# 후보 빈도 (Kiwi 토큰, 인접명사 배제 후, 2024)
candidate_freq:
  한국: 4057
  대한민국: 2496
  남조선: 196
  남쪽: 185
  남한: 172
  용산: 41
  청와대: 25
  남측: 3
  여기: 2888     # 제외
  이쪽: 252      # 제외
  서울: 388      # 제외(KBS와 동일)

# KWIC 검수 (2026-10-27)
kwic_review:
  남조선: >-
    30건 표본 거의 전부가 북한 시절 발화·교육·선전의 재현("남조선이 이렇게 나쁜 놈들이고",
    "너네 남조선이라 하던가"). 화자 자신의 현재 지칭이 아님 → KBS 인용 구간과 기능적 등가.
    '남조선제외' 버전을 KBS '인용 제외'의 대응으로 사용.
  남쪽: >-
    25건 표본에서 개체 지시("남쪽에 보내는 오물", "남쪽 방송")와 방향어("남쪽으로 내려가면",
    "바람이 북에서 남쪽으로")가 혼재. KBS 어휘집에도 없음 → 주 분석 제외, 민감도(관계어 추가)만.
  남한: 12건 표본 전부 개체 지시. 유지.
  여기/이쪽: 화자 위치 의존 직시어("여기 한국") — KBS의 '우리' 제외와 같은 논리로 제외.

notes:
  - "유튜브엔 quote_spans 없음. 남조선 제외는 인용 제외의 근사일 뿐, 재현 발화 속 '한국'까지 거르지는 못함"
  - "자막은 100% ASR. 고유명사 오인식 가능성은 KWIC 표본상 지칭어 판정에 영향 없었음"
