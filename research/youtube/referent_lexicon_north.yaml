# 지칭어 통제어휘집 — 북측(North Korea) 개체 (v1, KWIC 검수 2026-11-16)
# 7.13 회의 6-1 "동일 대상 지칭어 비교(북한/북조선 …)". 남측(kbs/referent_lexicon.yaml)과 같은 원칙:
# Kiwi 토큰(사용자 사전 v2), 명사 태그, 인접명사 배제(뒤에 공백 없이 명사가 붙으면 복합어 → 제외: 북한군·북한산).
entity: 북측
unit: KBS 기사(ncd, 층1, 인용 포함/제외) · 유튜브 영상(video_id, 장르별) · KBS 2024 탈북민 인용

types:
  국가명:      [북한]                                  # 남측 관행 국가 호칭
  관계어:      [북측, 북녘, 이북]                       # 남북 관계 안의 한쪽
  북한식자칭:   [북조선, 공화국, 조선민주주의인민공화국]     # 북한 공식·자칭 (주로 인용·재현 발화)
  적대어:      [북괴]

rules:
  - "이북: 직전 토큰이 명사·외국어·숫자(NLL·민통선·군사분계선·서울 등)면 공간 표현으로 보고 제외"
  - "공화국: 직전 토큰이 고유명사(도미니카·남아프리카 등)면 외국 국호로 보고 제외"

excluded:
  조선:   "단독형은 조선시대·단체명(조선 태권도위원회)·조선인·조선적 혼재 → 폐쇄 개체군 제외"
  평양:   "도시명 vs 정권 환유 판정 애매 — 남측 '서울' 제외와 같은 원칙"
  북쪽:   "방향어 혼재 — 남측 '남쪽'과 같이 민감도(관계어 추가)에서만"
  저기/저쪽/고향: "화자 위치 의존 직시어 — 남측 '여기·우리' 제외와 같은 원칙"

versions:
  KBS:   "인용 포함 / 인용 제외(quote_spans 밖)"
  유튜브: "전체 / 북한식자칭 제외(≈ 인용 제외; 남측 '남조선 제외'와 같은 논리)"

kwic_review:
  조선:   "KBS 200·유튜브 215건 표본: 북한 인용 '조선 인민', 단체명 출처 표기, 조선시대, 조선적 등 혼재"
  공화국:  "KBS 대부분 북한 매체·김정은 연설 인용('우리 공화국'), 일부 외국 국호. 유튜브는 북한 발화 재현·'공화국 영웅' 등"
  북조선:  "KBS 3건 모두 탈북민 인용. 유튜브 43건은 탈북민의 북한 지칭(재현·습관) 혼재"
  이북:   "KBS 14건 대부분 'NLL·민통선·군사분계선 이북' 공간 표현. 유튜브 일부 '이북 사람들' 지칭"
  북괴:   "KBS 1건(1986 국방부 인용), 유튜브 6건(정세·체제형 해설)"
